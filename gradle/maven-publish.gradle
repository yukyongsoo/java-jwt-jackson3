buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "software.amazon.awssdk:auth:2.41.17"
    }
}


apply plugin: 'maven-publish'
apply plugin: 'signing'

task('sourcesJar', type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

task('javadocJar', type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.getDestinationDir()
}
tasks.withType(Javadoc).configureEach {
    javadocTool = javaToolchains.javadocToolFor {
        // Use latest JDK for javadoc generation
        languageVersion = JavaLanguageVersion.of(17)
    }
}

javadoc {
    // Specify the Java version that the project will use
    options.addStringOption('-release', "17")
}
artifacts {
    archives sourcesJar, javadocJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {

            groupId = GROUP
            artifactId = POM_ARTIFACT_ID
            version = getVersionName()

            artifact("$buildDir/libs/${project.name}-${version}.jar")
            artifact sourcesJar
            artifact javadocJar

            pom {
                name = POM_NAME
                packaging = POM_PACKAGING
                description = POM_DESCRIPTION
                url = POM_URL

                licenses {
                    license {
                        name = POM_LICENCE_NAME
                        url = POM_LICENCE_URL
                        distribution = POM_LICENCE_DIST
                    }
                }

                developers {
                    developer {
                        id = POM_DEVELOPER_ID
                        name = POM_DEVELOPER_NAME
                        email = POM_DEVELOPER_EMAIL
                    }
                }

                scm {
                    url = POM_SCM_URL
                    connection = POM_SCM_CONNECTION
                    developerConnection = POM_SCM_DEV_CONNECTION
                }

                pom.withXml {
                    def dependenciesNode = asNode().appendNode('dependencies')

                    project.configurations.implementation.allDependencies.each {
                        def dependencyNode = dependenciesNode.appendNode('dependency')
                        dependencyNode.appendNode('groupId', it.group)
                        dependencyNode.appendNode('artifactId', it.name)
                        dependencyNode.appendNode('version', it.version)
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = "BunjangS3Releases"
            url = uri("s3://bun-maven-repo/releases")

            credentials(AwsCredentials) {
                def awsCredentials = software.amazon.awssdk.auth.credentials.DefaultCredentialsProvider
                        .create()
                        .resolveCredentials()

                accessKey = awsCredentials.accessKeyId()
                secretKey = awsCredentials.secretAccessKey()

                if (awsCredentials instanceof software.amazon.awssdk.auth.credentials.AwsSessionCredentials) {
                    sessionToken = ((software.amazon.awssdk.auth.credentials.AwsSessionCredentials) awsCredentials).sessionToken()
                }
            }
        }
    }
}

